<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DroneSplat – Sculpture 360° Panorama</title>
<link rel="stylesheet" href="../lib/pannellum.css" />
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #panorama { width: 100%; height: 100%; }
  #note {
    position: absolute; z-index: 10; bottom: 10px; left: 10px;
    font-family: system-ui, sans-serif; color: #ddd; font-size: 12px;
    background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; max-width: 380px; line-height: 1.5;
  }
</style>
</head>
<body>
<div id="panorama"></div>
<div id="note">
  <b>360° · Sculpture</b><br/>
  Drag untuk melihat sekeliling. Capture Sculpture adalah orbit ketat dari atas,
  jadi konten hanya di arah bawah (patung & taman) — untuk scene ini, viewer
  <b>orbit 3DGS</b> jauh lebih representatif.
</div>
<script src="../lib/pannellum.js"></script>
<script>
pannellum.viewer('panorama', {
  type: 'equirectangular',
  panorama: './equirect.png',
  autoLoad: true,
  showZoomCtrl: true,
  showFullscreenCtrl: true,
  yaw: 0,
  pitch: -55,    // the observed content sits below (drone looked down)
  hfov: 110,
  minHfov: 50,
  maxHfov: 120,
  compass: false
});
</script>
</body>
</html>
